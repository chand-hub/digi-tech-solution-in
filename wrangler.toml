# Cloudflare Pages & D1 Configuration for DIGI TECH SOLUTION
#
# Cloudflare Pages Git Integration deploys automatically from GitHub:
#   - Build command: bun run build
#   - Build output directory: dist
#   - Deploy command: (leave empty / not used for Cloudflare Pages Git integration)
#
# Optional D1 Database Setup:
#   1. Create D1 database: npx wrangler d1 create digitech-solution-db
#   2. Apply schema: npx wrangler d1 execute digitech-solution-db --remote --file=./schema.sql
#   3. Bind "DB" in Cloudflare Dashboard (Pages -> Settings -> Bindings)
#      OR uncomment [[d1_databases]] below with your real database_id UUID.

name = "digi-tech-solution"
compatibility_date = "2025-02-01"
pages_build_output_dir = "dist"

# Uncomment and replace with your real Cloudflare D1 UUID once created,
# or configure the "DB" binding directly in Cloudflare Pages Dashboard:
# [[d1_databases]]
# binding = "DB"
# database_name = "digitech-solution-db"
# database_id = "YOUR_CLOUDFLARE_D1_UUID"
